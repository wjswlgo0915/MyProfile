
{{/* layouts/partials/profile.html */}}
<div class="flex flex-col items-center mb-8">
  {{ with .Params.profileImage }}
    {{ $img := replaceRE "^/" "" . }}
    {{ $imgURL := $img | relURL }}

    <!-- 기존 원형 프로필 사진 -->
    <button type="button"
            class="profile-image-button mb-4"
            aria-label="프로필 사진 전체 보기"
            onclick="document.getElementById('profile-modal').showModal()">
      <img src="{{ $imgURL }}"
           alt="{{ $.Params.name }}의 프로필 이미지"
           class="profile-pic">
    </button>

    <!-- 프로필 사진 팝업 -->
    <dialog id="profile-modal"
            class="profile-modal"
            aria-label="프로필 사진 전체 보기"
            onclick="if (event.target === this) this.close()"
            onclose="
              const button = this.querySelector('.profile-zoom-button');
              const img = button.querySelector('img');
              img.classList.remove('is-zoomed');
              button.setAttribute('aria-pressed', 'false');
              button.setAttribute('aria-label', '사진 확대');
            ">

      <!-- 닫기 버튼 -->
      <button type="button"
              class="profile-modal-close"
              aria-label="닫기"
              onclick="document.getElementById('profile-modal').close()">
        &times;
      </button>

      <!-- 팝업 안의 사진 확대 영역 -->
      <div class="profile-zoom-area">
        <button type="button"
                class="profile-zoom-button"
                aria-label="사진 확대"
                aria-pressed="false"
                onclick="
                  const img = this.querySelector('img');
                  const zoomed = img.classList.toggle('is-zoomed');
                  this.setAttribute('aria-pressed', String(zoomed));
                  this.setAttribute('aria-label', zoomed ? '사진 축소' : '사진 확대');
                ">
          <img src="{{ $imgURL }}"
               alt="{{ $.Params.name }}의 전체 프로필 이미지"
               class="profile-modal-image">
        </button>
      </div>
    </dialog>
  {{ end }}

  <!-- 이름 -->
  <h1 class="text-3xl font-bold mb-2 text-center"
      style="color: var(--text-color)">
    {{ .Params.name }}
  </h1>

  <!-- 자기소개 -->
  <p class="text-center opacity-80 mb-6">
    {{ .Params.description }}
  </p>

  <!-- SNS 아이콘 -->
  <div class="flex flex-wrap justify-center gap-4 mb-8 social-icons">
    {{ range .Params.socials }}
      <a href="{{ .url }}"
         class="text-xl"
         target="_blank"
         rel="noopener">
        <i class="{{ .icon }} icon"></i>
      </a>
    {{ end }}
  </div>
</div>

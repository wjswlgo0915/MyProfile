
{{/* layouts/partials/profile.html */}}
<div class="flex flex-col items-center mb-8">
    {{ with .Params.profileImage }}
      {{ $img := replaceRE "^/" "" . }}
      {{ $imgURL := $img | relURL }}

      <!-- 클릭할 수 있는 프로필 사진 -->
      <button type="button"
              class="profile-image-button mb-4"
              aria-label="프로필 사진 크게 보기"
              onclick="document.getElementById('profile-modal').showModal()">
        
<div class="profile-zoom-area" id="profile-zoom-area">
  <img src="{{ $imgURL }}"
       alt="{{ $.Params.name }}의 프로필 이미지 전체"
       class="profile-modal-image"
       onclick="this.classList.toggle('is-zoomed')">
</div>

      </button>

      <!-- 원본 사진 확대창 -->
      <dialog id="profile-modal" class="profile-modal"
              aria-label="프로필 사진 전체 보기"
              onclick="if (event.target === this) this.close()">
        <button type="button"
                class="profile-modal-close"
                aria-label="닫기"
                onclick="document.getElementById('profile-modal').close()">
          &times;
        </button>

        <img src="{{ $imgURL }}"
             alt="{{ $.Params.name }}의 프로필 이미지 전체"
             class="profile-modal-image">
      </dialog>
    {{ end }}

    <h1 class="text-3xl font-bold mb-2 text-center" style="color: var(--text-color)">
      {{ .Params.name }}
    </h1>
    <p class="text-center opacity-80 mb-6">{{ .Params.description }}</p>

    <div class="flex flex-wrap justify-center gap-4 mb-8 social-icons">
      {{ range .Params.socials }}
        <a href="{{ .url }}" class="text-xl" target="_blank" rel="noopener">
          <i class="{{ .icon }} icon"></i>
        </a>
      {{ end }}
    </div>
</div>
